<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Panel de Control | SOS-VITAL</title>
</head>
<body>
    <header><h1>Panel de Gestión</h1></header>
    <div class="container">
        <div class="card" id="loginForm">
            <h3>Acceso de Usuario</h3>
            <input type="text" id="code" placeholder="Código de pack (ej: SOSV-2500-001)">
            <button onclick="validar()">Ingresar</button>
        </div>
        <div class="card" id="dashboard" style="display:none;">
            <h3>Mis Registros</h3>
            <p>Generar código para nuevo integrante o artículo:</p>
            <input type="text" id="itemName" placeholder="Nombre (Mascota, Niño, Objeto)">
            <input type="email" id="itemEmail" placeholder="Correo electrónico">
            <input type="tel" id="itemPhone" placeholder="Teléfono (opcional)">
            <button onclick="generarQR()">Generar Código de Emergencia</button>
            <div id="qrResult" style="margin-top:20px; padding:15px; border:1px solid #ccc; background:#f9f9f9;"></div>
        </div>
    </div>
    <script>
        const validCodes = ['SOSV-2500-001', 'SOSV-2500-002'];
        function validar() {
            const code = document.getElementById('code').value;
            if (validCodes.includes(code)) {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } else { alert('Código inválido'); }
        }
        function generarQR() {
            const name = document.getElementById('itemName').value.trim();
            const email = document.getElementById('itemEmail').value.trim();
            const phone = document.getElementById('itemPhone').value.trim();
            if (!name) { alert('Ingresa un nombre'); return; }
            if (!email && !phone) { alert('Ingresa al menos un correo o teléfono de contacto'); return; }
            const uniqueID = Math.random().toString(36).substr(2, 9);
            const baseUrl = window.location.href.replace('dashboard.html', 'reporte.html');
            const demoUrl = baseUrl + '?id=' + uniqueID + '&nombre=' + encodeURIComponent(name) + '&email=' + encodeURIComponent(email) + '&telefono=' + encodeURIComponent(phone);
            document.getElementById('qrResult').innerHTML =
                '<strong>Código para: ' + name + '</strong><br>' +
                '<p>URL de prueba (Copia y pega en tu celular para ver el reporte):<br>' +
                '<a href="' + demoUrl + '" target="_blank">' + demoUrl + '</a></p>';
        }
    </script>
</body>
</html>
