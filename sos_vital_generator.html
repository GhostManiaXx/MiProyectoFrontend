<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS-VITAL | Generador de QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }

        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .card h2 { color: #667eea; margin-bottom: 1.5rem; font-size: 1.5rem; }

        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; color: #333; margin-bottom: 0.5rem; }
        input, textarea { width: 100%; padding: 0.8rem; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; font-family: inherit; transition: border-color 0.3s; }
        input:focus, textarea:focus { outline: none; border-color: #667eea; }

        .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 1rem 2rem; border-radius: 50px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; width: 100%; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4); }
        .btn:active { transform: translateY(0); }

        #qr-result { background: #f8f9fa; padding: 2rem; border-radius: 15px; text-align: center; }
        #qrcode { margin: 1rem auto; }

        .qr-info { background: #e8f5e9; padding: 1rem; border-radius: 8px; margin-top: 1rem; color: #2e7d32; font-size: 0.9rem; }
        .download-btn { background: #4caf50; margin-top: 1rem; }
        .download-btn:hover { background: #45a049; }

        .preview-url { background: #f0f0f0; padding: 1rem; border-radius: 8px; margin-top: 1rem; word-break: break-all; font-size: 0.85rem; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <!-- FORMULARIO -->
        <div class="card">
            <h2>📝 Crear Etiqueta SOS-VITAL</h2>

            <div class="form-group">
                <label for="nombre">Nombre de la Mascota/Persona:</label>
                <input type="text" id="nombre" placeholder="Ej: Max, Abuelita Rosa">
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono del Dueño:</label>
                <input type="tel" id="telefono" placeholder="Ej: +56987654321">
            </div>

            <div class="form-group">
                <label for="email">Email (opcional):</label>
                <input type="email" id="email" placeholder="Ej: correo@ejemplo.com">
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción (raza, características):</label>
                <textarea id="descripcion" rows="3" placeholder="Ej: Gato gris, collar azul, 5 años"></textarea>
            </div>

            <button class="btn" onclick="generarQR()">🔗 GENERAR QR</button>
        </div>

        <!-- RESULTADO -->
        <div class="card">
            <h2>🎯 Tu Código QR</h2>
            <div id="qr-result" style="display: none;">
                <div id="qrcode"></div>
                <div class="qr-info">
                    <strong>✅ QR Generado</strong><br>
                    Imprime este código y pégalo en el collar o la etiqueta.
                </div>
                <div class="preview-url">
                    <strong>URL del QR:</strong><br>
                    <span id="qr-url"></span>
                </div>
                <button class="btn download-btn" onclick="descargarQR()">📥 DESCARGAR QR</button>
            </div>
            <div id="placeholder" style="color: #999; text-align: center; padding: 3rem 1rem;">
                Los QR generados aparecerán aquí
            </div>
        </div>
    </div>

    <script>
        function generarQR() {
            const nombre = document.getElementById('nombre').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const email = document.getElementById('email').value.trim();
            const descripcion = document.getElementById('descripcion').value.trim();

            if (!nombre || !telefono) {
                alert('Por favor completa al menos Nombre y Teléfono');
                return;
            }

            // Crear URL con los datos
            const url = `https://forms.gle/TuFormularioDeDatos`; // Placeholder - se actualiza abajo
            const qrUrl = `https://sos-vital-demo.netlify.app/?nombre=${encodeURIComponent(nombre)}&telefono=${encodeURIComponent(telefono)}&email=${encodeURIComponent(email)}&desc=${encodeURIComponent(descripcion)}`;

            // Limpiar QR anterior
            document.getElementById('qrcode').innerHTML = '';

            // Generar nuevo QR
            new QRCode(document.getElementById('qrcode'), {
                text: qrUrl,
                width: 250,
                height: 250,
                colorDark: '#667eea',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });

            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('qr-result').style.display = 'block';
            document.getElementById('qr-url').textContent = qrUrl;
        }

        function descargarQR() {
            const canvas = document.querySelector('#qrcode canvas');
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'sos-vital-qr.png';
            link.click();
        }
    </script>
</body>
</html>
